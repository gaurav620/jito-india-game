# =============================================================================
# JITO INDIA GAMES — Docker Compose (local development)
# =============================================================================
# Provides PostgreSQL and Redis for local development.
# Do NOT use this compose file for production.
#
# Usage:
#   docker-compose up -d          # Start services in background
#   docker-compose down           # Stop services
#   docker-compose down -v        # Stop and remove volumes (reset DB)
#
# Prerequisites: Docker Desktop or Docker Engine + Compose V2
# =============================================================================

version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — the single source of truth
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: jito_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jito
      POSTGRES_PASSWORD: jito_dev_password
      POSTGRES_DB: jito_games_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jito -d jito_games_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Redis 7 — rate limiting, leader lock, pub/sub fan-out
  # Redis is NOT authoritative. All state is in PostgreSQL.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: jito_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: jito_postgres_data
  redis_data:
    name: jito_redis_data
